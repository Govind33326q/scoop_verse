name: Deploy to EC2
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install && npm test
      - name: Deploy
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$KEY" > key.pem && chmod 600 key.pem
          SSH="ssh -i key.pem -o StrictHostKeyChecking=no"
          rsync -az --delete --exclude .git --exclude node_modules -e "$SSH" ./ $USER@$HOST:~/app/
          $SSH $USER@$HOST 'cd ~/app && npm ci --omit=dev || npm install --omit=dev; sudo cp deploy/nginx.conf /etc/nginx/conf.d/scoopverse.conf; sudo cp deploy/scoopverse.service /etc/systemd/system/; sudo systemctl daemon-reload; sudo systemctl restart scoopverse; sudo nginx -t && sudo systemctl reload nginx; sleep 3; curl -sf localhost:3000/health'
